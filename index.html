<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vector Stock Tool</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      padding: 20px;
    }

    .app {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 25px;
    }

    .box {
      background: #1f2937;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    input[type="file"] {
      width: 100%;
      padding: 15px;
      background: #374151;
      color: white;
      border-radius: 10px;
    }

    .preview {
      margin-top: 20px;
      text-align: center;
    }

    .preview img {
      max-width: 100%;
      max-height: 350px;
      border-radius: 12px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    label {
      font-size: 14px;
      color: #d1d5db;
    }

    input[type="number"] {
      width: 100%;
      margin-top: 6px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #22c55e;
      color: white;
    }

    .secondary {
      background: #3b82f6;
      color: white;
    }

    .status {
      text-align: center;
      margin-top: 15px;
      color: #a7f3d0;
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>Vector Stock Tool</h1>

    <div class="subtitle">
      Prepare your artwork for stock submission
    </div>

    <div class="box">

      <input
        type="file"
        id="imageInput"
        accept="image/png,image/jpeg,image/webp"
      >

      <div class="preview">
        <img id="previewImage" style="display:none;">
      </div>

      <div class="controls">

        <div>
          <label>Width (px)</label>
          <input type="number" id="width" value="2000">
        </div>

        <div>
          <label>Height (px)</label>
          <input type="number" id="height" value="2000">
        </div>

      </div>

      <button class="secondary" onclick="resizeImage()">
        Resize Image
      </button>

      <button class="primary" onclick="downloadPNG()">
        Download PNG
      </button>

      <div class="status" id="status">
        Ready
      </div>

    </div>

  </div>

  <script>

    let originalImage = null;

    const imageInput = document.getElementById("imageInput");
    const previewImage = document.getElementById("previewImage");
    const statusText = document.getElementById("status");

    imageInput.addEventListener("change", function(event) {

      const file = event.target.files[0];

      if (!file) return;

      const reader = new FileReader();

      reader.onload = function(e) {

        originalImage = new Image();

        originalImage.onload = function() {

          previewImage.src = e.target.result;
          previewImage.style.display = "block";

          document.getElementById("width").value =
            originalImage.width;

          document.getElementById("height").value =
            originalImage.height;

          statusText.textContent =
            "Image loaded successfully";

        };

        originalImage.src = e.target.result;

      };

      reader.readAsDataURL(file);

    });


    function resizeImage() {

      if (!originalImage) {

        alert("Please upload an image first.");

        return;

      }

      const width =
        parseInt(document.getElementById("width").value);

      const height =
        parseInt(document.getElementById("height").value);

      const canvas =
        document.createElement("canvas");

      canvas.width = width;
      canvas.height = height;

      const ctx =
        canvas.getContext("2d");

      ctx.drawImage(
        originalImage,
        0,
        0,
        width,
        height
      );

      previewImage.src =
        canvas.toDataURL("image/png");

      statusText.textContent =
        "Image resized successfully";

    }


    function downloadPNG() {

      if (!originalImage) {

        alert("Please upload an image first.");

        return;

      }

      const width =
        parseInt(document.getElementById("width").value);

      const height =
        parseInt(document.getElementById("height").value);

      const canvas =
        document.createElement("canvas");

      canvas.width = width;
      canvas.height = height;

      const ctx =
        canvas.getContext("2d");

      ctx.drawImage(
        originalImage,
        0,
        0,
        width,
        height
      );

      const link =
        document.createElement("a");

      link.download =
        "stock-image.png";

      link.href =
        canvas.toDataURL("image/png");

      link.click();

      statusText.textContent =
        "PNG downloaded";

    }

  </script>

</body>
  </html>
