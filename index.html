<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vector Stock Tool</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  font-family: Arial, sans-serif;
  background: #111827;
  color: white;
}

.app {
  max-width: 700px;
  margin: auto;
}

h1 {
  text-align: center;
  margin-bottom: 6px;
}

.subtitle {
  text-align: center;
  color: #9ca3af;
  margin-bottom: 20px;
}

.box {
  background: #1f2937;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 18px;
}

h2 {
  margin-top: 0;
  font-size: 20px;
}

input,
textarea {
  width: 100%;
  padding: 13px;
  border: 0;
  border-radius: 9px;
  font-size: 15px;
}

input[type="file"] {
  background: #374151;
  color: white;
}

textarea {
  min-height: 110px;
  resize: vertical;
}

.preview {
  margin-top: 18px;
  text-align: center;
  padding: 10px;
  border-radius: 12px;
  background: white;
}

.preview img {
  max-width: 100%;
  max-height: 350px;
  border-radius: 10px;
}

.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 18px;
}

label {
  display: block;
  margin-bottom: 6px;
  color: #d1d5db;
  font-size: 14px;
}

.checkrow {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
}

.checkrow input {
  width: 18px;
  height: 18px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
}

.blue {
  background: #3b82f6;
  color: white;
}

.green {
  background: #22c55e;
  color: white;
}

.orange {
  background: #f59e0b;
  color: white;
}

.gray {
  background: #4b5563;
  color: white;
}

.status {
  text-align: center;
  margin-top: 14px;
  color: #a7f3d0;
}

.result {
  margin-top: 14px;
  padding: 14px;
  background: #111827;
  border-radius: 10px;
  line-height: 1.7;
}

.small {
  color: #9ca3af;
  font-size: 13px;
  line-height: 1.5;
}

@media (max-width: 500px) {
  .controls {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="app">

<h1>Vector Stock Tool</h1>

<div class="subtitle">
Prepare your artwork for stock submission
</div>


<div class="box">

<h2>1. Upload Artwork</h2>

<input
  type="file"
  id="imageInput"
  accept="image/png,image/jpeg,image/webp"
>

<div
  class="preview"
  id="previewBox"
  style="display:none;"
>
<img id="previewImage">
</div>

<div class="status" id="status">
Ready
</div>

</div>


<div class="box">

<h2>2. Resize</h2>

<div class="controls">

<div>
<label>Width (px)</label>
<input
  type="number"
  id="width"
  value="2000"
  min="1"
>
</div>

<div>
<label>Height (px)</label>
<input
  type="number"
  id="height"
  value="2000"
  min="1"
>
</div>

</div>

<div class="checkrow">

<input
  type="checkbox"
  id="lockRatio"
  checked
>

<label for="lockRatio">
Lock aspect ratio
</label>

</div>

<button
  class="blue"
  onclick="resizeImage()"
>
Resize Image
</button>

</div>


<div class="box">

<h2>3. Background Remove</h2>

<p class="small">
Removes white/light background from simple images.
</p>

<button
  class="orange"
  onclick="removeBackground()"
>
Remove White Background
</button>

</div>


<div class="box">

<h2>4. Download</h2>

<button
  class="green"
  onclick="downloadPNG()"
>
Download Transparent PNG
</button>

<button
  class="gray"
  onclick="downloadJPG()"
>
Download JPG
</button>

<button
  class="blue"
  onclick="downloadSVG()"
>
Download SVG
</button>

</div>


<div class="box">

<h2>5. Stock Check</h2>

<p class="small">
Basic technical check only. It does not guarantee stock approval.
</p>

<button
  class="blue"
  onclick="stockCheck()"
>
Check Artwork
</button>

<div
  class="result"
  id="checkResult"
>
Not checked yet.
</div>

</div>


<div class="box">

<h2>6. Metadata</h2>

<label>Title</label>

<input
  type="text"
  id="title"
  placeholder="Example: Modern abstract background"
>

<br><br>

<label>Keywords</label>

<textarea
  id="keywords"
  placeholder="abstract, background, modern, design"
></textarea>

<button
  class="green"
  onclick="copyMetadata()"
>
Copy Metadata
</button>

</div>

</div>


<script>

let originalImage = null;
let workingCanvas = null;
let originalRatio = 1;

const imageInput =
document.getElementById("imageInput");

const previewImage =
document.getElementById("previewImage");

const previewBox =
document.getElementById("previewBox");

const statusText =
document.getElementById("status");

const widthInput =
document.getElementById("width");

const heightInput =
document.getElementById("height");

const lockRatio =
document.getElementById("lockRatio");


imageInput.addEventListener(
"change",
function(event) {

const file =
event.target.files[0];

if (!file) return;

const reader =
new FileReader();

reader.onload =
function(e) {

originalImage =
new Image();

originalImage.onload =
function() {

previewImage.src =
e.target.result;

previewBox.style.display =
"block";

widthInput.value =
originalImage.width;

heightInput.value =
originalImage.height;

originalRatio =
originalImage.width /
originalImage.height;

workingCanvas = null;

statusText.textContent =
"Image loaded successfully";

};

originalImage.src =
e.target.result;

};

reader.readAsDataURL(file);

});


widthInput.addEventListener(
"input",
function() {

if (
lockRatio.checked &&
originalImage
) {

heightInput.value =
Math.round(
Number(widthInput.value) /
originalRatio
);

}

});


heightInput.addEventListener(
"input",
function() {

if (
lockRatio.checked &&
originalImage
) {

widthInput.value =
Math.round(
Number(heightInput.value) *
originalRatio
);

}

});


function makeCanvas() {

if (!originalImage) {

alert(
"Please upload an image first."
);

return null;

}

const width =
parseInt(widthInput.value);

const height =
parseInt(heightInput.value);

const canvas =
document.createElement("canvas");

canvas.width =
width;

canvas.height =
height;

const ctx =
canvas.getContext("2d");

ctx.drawImage(
originalImage,
0,
0,
width,
height
);

workingCanvas =
canvas;

return canvas;

}


function resizeImage() {

const canvas =
makeCanvas();

if (!canvas) return;

previewImage.src =
canvas.toDataURL("image/png");

statusText.textContent =
"Image resized successfully";

}


function removeBackground() {

const canvas =
makeCanvas();

if (!canvas) return;

const ctx =
canvas.getContext("2d");

const imageData =
ctx.getImageData(
0,
0,
canvas.width,
canvas.height
);

const data =
imageData.data;

for (
let i = 0;
i < data.length;
i += 4
) {

const r = data[i];
const g = data[i + 1];
const b = data[i + 2];

if (
r > 235 &&
g > 235 &&
b > 235
) {

data[i + 3] = 0;

}

}

ctx.putImageData(
imageData,
0,
0
);

previewImage.src =
canvas.toDataURL("image/png");

workingCanvas =
canvas;

statusText.textContent =
"White background removed";

}


function downloadPNG() {

const canvas =
workingCanvas || makeCanvas();

if (!canvas) return;

const link =
document.createElement("a");

link.download =
"stock-transparent.png";

link.href =
canvas.toDataURL("image/png");

link.click();

}


function downloadJPG() {

const canvas =
makeCanvas();

if (!canvas) return;

const jpg =
document.createElement("canvas");

jpg.width =
canvas.width;

jpg.height =
canvas.height;

const ctx =
jpg.getContext("2d");

ctx.fillStyle =
"white";

ctx.fillRect(
0,
0,
jpg.width,
jpg.height
);

ctx.drawImage(
canvas,
0,
0
);

const link =
document.createElement("a");

link.download =
"stock-image.jpg";

link.href =
jpg.toDataURL(
"image/jpeg",
0.95
);

link.click();

}


function downloadSVG() {

const canvas =
workingCanvas || makeCanvas();

if (!canvas) return;

const png =
canvas.toDataURL("image/png");

const svg =
`<svg xmlns="http://www.w3.org/2000/svg"
width="${canvas.width}"
height="${canvas.height}"
viewBox="0 0 ${canvas.width} ${canvas.height}">

<image
href="${png}"
width="${canvas.width}"
height="${canvas.height}"
/>

</svg>`;

const blob =
new Blob(
[svg],
{
type:"image/svg+xml"
}
);

const url =
URL.createObjectURL(blob);

const link =
document.createElement("a");

link.href =
url;

link.download =
"stock-image.svg";

link.click();

URL.revokeObjectURL(url);

}


function stockCheck() {

const result =
document.getElementById(
"checkResult"
);

if (!originalImage) {

result.innerHTML =
"⚠️ Please upload an image first.";

return;

}

const width =
parseInt(widthInput.value);

const height =
parseInt(heightInput.value);

let text = "";

if (
width >= 4000 ||
height >= 4000
) {

text +=
"✅ Large dimensions<br>";

} else {

text +=
"⚠️ Check image dimensions<br>";

}

const file =
imageInput.files[0];

if (file) {

text +=
"✅ Image uploaded<br>";

text +=
"📁 File: " +
file.name +
"<br>";

}

text +=
"<br>⚠️ Final stock acceptance is decided by the marketplace.";

result.innerHTML =
text;

}


function copyMetadata() {

const title =
document.getElementById(
"title"
).value;

const keywords =
document.getElementById(
"keywords"
).value;

const text =
"Title: " +
title +
"\n\nKeywords: " +
keywords;

if (
navigator.clipboard
) {

navigator.clipboard.writeText(text);

alert(
"Metadata copied!"
);

} else {

alert(text);

}

}

</script>

</body>
</html>
